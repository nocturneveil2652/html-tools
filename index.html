<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>DevTools Portal</title>
  <meta name="description" content="個人開発したHTML/JSベースのWebツール集ポータル">
  <meta property="og:title" content="DevTools Portal">
  <meta property="og:description" content="個人開発したHTML/JSベースのWebツール集ポータル">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      touch-action: manipulation;
    }
    html, body {
      touch-action: manipulation;
      -webkit-text-size-adjust: 100%;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased flex flex-col selection:bg-indigo-500 selection:text-white">

  <!-- 背景のグラデーション装飾 -->
  <div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
    <div class="absolute -top-40 -right-40 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl"></div>
    <div class="absolute top-1/3 -left-40 w-96 h-96 bg-violet-600/20 rounded-full blur-3xl"></div>
  </div>

  <div class="max-w-4xl mx-auto px-6 py-12 w-full flex-1">
    <!-- ヘッダー -->
    <header class="mb-12 border-b border-slate-800/80 pb-8 flex flex-col md:flex-row md:items-end justify-between gap-4">
      <div>
        <div class="flex items-center gap-3 mb-2">
          <div class="p-2 bg-indigo-500/10 border border-indigo-500/20 rounded-xl text-indigo-400">
            <i class="fa-solid fa-cubes text-xl"></i>
          </div>
          <h1 class="text-3xl font-extrabold tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">
            Web Tools Collection
          </h1>
        </div>
        <p class="text-slate-400 text-sm pl-11">
          個人開発したHTML/JSベースのWebツール集ポータル
        </p>
      </div>
      <div class="text-xs text-slate-500 font-mono pl-11 md:pl-0">
        Hosted on GitHub Pages
      </div>
    </header>

    <!-- メインコンテンツ -->
    <main>
      <div class="grid md:grid-cols-2 gap-6">

        <!-- ツール1: ビールカウンター -->
        <a href="./beer-counter/" class="group relative block p-6 bg-slate-900/60 hover:bg-slate-900/90 rounded-2xl border border-slate-800 hover:border-amber-500/50 transition-all duration-300 hover:shadow-xl hover:shadow-amber-500/10 hover:-translate-y-1">
          <div class="flex items-start justify-between mb-4">
            <div class="p-3 bg-amber-500/10 text-amber-400 border border-amber-500/20 rounded-xl group-hover:bg-amber-500 group-hover:text-slate-950 transition-colors duration-300 text-xl flex items-center justify-center">
              🍺
            </div>
            <span class="inline-flex items-center gap-1 text-xs font-medium text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-2.5 py-1 rounded-full">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
              Ready
            </span>
          </div>

          <h2 class="text-lg font-bold text-slate-100 group-hover:text-amber-400 transition-colors mb-2 flex items-center justify-between">
            🍺 ビールカウンター
            <i class="fa-solid fa-arrow-right text-xs opacity-0 -translate-x-2 group-hover:opacity-100 group-hover:translate-x-0 transition-all duration-300 text-amber-400"></i>
          </h2>

          <p class="text-slate-400 text-sm leading-relaxed mb-4">
            カウントアップに合わせて🍺がひとつづつ増えてずらりと並ぶ、杯数記録に最適なカウンターアプリ。
          </p>

          <div class="flex items-center gap-2 pt-2 border-t border-slate-800/50">
            <span class="text-[10px] font-mono bg-slate-800 text-slate-300 px-2 py-0.5 rounded">Tailwind</span>
            <span class="text-[10px] font-mono bg-slate-800 text-slate-300 px-2 py-0.5 rounded">JavaScript</span>
          </div>
        </a>

        <!-- ツール2: ホワサバ ステーション管理 -->
        <a href="./station-timer/" class="group relative block p-6 bg-slate-900/60 hover:bg-slate-900/90 rounded-2xl border border-slate-800 hover:border-blue-500/50 transition-all duration-300 hover:shadow-xl hover:shadow-blue-500/10 hover:-translate-y-1">
          <div class="flex items-start justify-between mb-4">
            <div class="p-3 bg-blue-500/10 text-blue-400 border border-blue-500/20 rounded-xl group-hover:bg-blue-500 group-hover:text-slate-950 transition-colors duration-300 text-xl flex items-center justify-center">
              ⚔️
            </div>
            <span class="inline-flex items-center gap-1 text-xs font-medium text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-2.5 py-1 rounded-full">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
              Ready
            </span>
          </div>

          <h2 class="text-lg font-bold text-slate-100 group-hover:text-blue-400 transition-colors mb-2 flex items-center justify-between">
            ⚔️ ホワサバ ステーション管理
            <i class="fa-solid fa-arrow-right text-xs opacity-0 -translate-x-2 group-hover:opacity-100 group-hover:translate-x-0 transition-all duration-300 text-blue-400"></i>
          </h2>

          <p class="text-slate-400 text-sm leading-relaxed mb-4">
            攻撃・防御ステーションの残り時間と状態から、保護切れ・争奪リミット日時をJST/UTC併記で即時算出する管理ツール。
          </p>

          <div class="flex items-center gap-2 pt-2 border-t border-slate-800/50">
            <span class="text-[10px] font-mono bg-slate-800 text-slate-300 px-2 py-0.5 rounded">JST/UTC</span>
            <span class="text-[10px] font-mono bg-slate-800 text-slate-300 px-2 py-0.5 rounded">JavaScript</span>
          </div>
        </a>

        <!-- 今後ツールを追加する場合はここを複製 -->

      </div>
    </main>
  </div>

  <script>
    // ダブルタップ（連打）によるズームの防止
    let lastTouchEnd = 0;
    document.addEventListener('touchend', (e) => {
      const now = Date.now();
      if (now - lastTouchEnd <= 350) {
        if (!['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) {
          e.preventDefault();
        }
      }
      lastTouchEnd = now;
    }, { passive: false });

    document.addEventListener('gesturestart', (e) => {
      e.preventDefault();
    });
  </script>
</body>
</html>
